[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonlight-steam-sync"
dynamic = ["version"]
description = "Sync a Moonlight host's game list into Steam as non-Steam shortcuts, with SteamGridDB/Steam-CDN artwork."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
moonlight-steam-sync = "moonlight_steam_sync.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "vdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "moonlight_steam_sync.__version__" }
